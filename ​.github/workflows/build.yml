name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Project ZIP
        run: |
          unzip -o SafeKids-Complete-Project.zip -d extracted_project
          cp -r extracted_project/* ./

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies & Build Web
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build || true
          fi

      - name: Build Android APK
        run: |
          if [ -d android ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeKids-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
