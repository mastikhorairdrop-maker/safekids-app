name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: List Files to Check Structure
        run: ls -la

      - name: Unzip Project if ZIP exists
        run: |
          if [ -f "SafeKids-Complete-Project.zip" ]; then
            unzip -o SafeKids-Complete-Project.zip
          elif [ -f "safekids.zip" ]; then
            unzip -o safekids.zip
          fi
          ls -la

      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          if [ -n "$GRADLEW_PATH" ]; then
            DIR_PATH=$(dirname "$GRADLEW_PATH")
            cd "$DIR_PATH"
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Error: gradlew not found!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeKids-APK
          path: '**/build/outputs/apk/debug/*.apk'
