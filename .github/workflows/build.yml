name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unzip Project and Build
        run: |
          if [ -f "SafeKids-Complete-Project.zip" ]; then
            unzip -o SafeKids-Complete-Project.zip
          fi
          
          # Find where android folder or gradlew is located after unzipping
          ANDROID_DIR=$(find . -type d -name "android" | head -n 1)
          if [ -n "$ANDROID_DIR" ]; then
            cd "$ANDROID_DIR"
          else
            cd $(dirname $(find . -name "gradlew" | head -n 1))
          fi

          # Install root dependencies if package.json exists nearby
          cd ..
          if [ -f "package.json" ]; then
            npm install || true
            npm run build || true
          fi
          
          # Go back to android and build
          if [ -d "android" ]; then
            cd android
          fi
          
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeKids-APK
          path: '**/build/outputs/apk/debug/*.apk'
