name: Check Directory Structure and Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find where package.json is located
        run: |
          echo "=== ROOT DIRECTORY CONTENTS ==="
          ls -la
          echo "=== SEARCHING FOR PACKAGE.JSON ==="
          find . -name "package.json" -not -path "*/node_modules/*"
