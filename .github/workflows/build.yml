name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract all zips if any
        run: |
          for z in *.zip; do
            [ -f "$z" ] && unzip -o "$z"
          done
          ls -la

      - name: Locate and Build with Gradle
        run: |
          # Find gradlew file anywhere in the workspace
          GRADLEW_FILE=$(find . -name "gradlew" -type f | head -n 1)
          
          if [ -z "$GRADLEW_FILE" ]; then
            echo "Error: gradlew not found anywhere!"
            exit 1
          fi
          
          # Get directory containing gradlew
          PROJECT_DIR=$(dirname "$GRADLEW_FILE")
          echo "Found gradlew in: $PROJECT_DIR"
          
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeKids-APK
          path: '**/build/outputs/apk/debug/*.apk'
