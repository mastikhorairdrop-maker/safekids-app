name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Dependencies
        working-directory: safekids-app
        run: |
          npm install
          npm install @capacitor/android
          npm install -g @capacitor/cli

      - name: Build Web App
        working-directory: safekids-app
        run: npm run build

      - name: Add and Sync Capacitor Android
        working-directory: safekids-app
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Build APK with Gradle
        working-directory: safekids-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: safekids-app/android/app/build/outputs/apk/debug/app-debug.apk
